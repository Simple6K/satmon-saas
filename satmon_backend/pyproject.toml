[project]
name = "satmon_backend"
version = "0.1.0"
description = "卫星遥感监测 SaaS 平台后端（多租户订阅/监测任务/影像检索/变化检测/报告）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "apscheduler>=3.10,<4",
    # AOI 多边形有效性校验与 4326 面积计算（契约 §3）
    "shapely>=2.0",
    # 数据源适配层运行时依赖（容器 --no-dev 安装，此前误置于 dev 依赖）
    "httpx>=0.27",
    # anntoconfig / anntologger 为项目内 vendored 包（anntoconfig/、anntologger/ 目录），
    # 此处只需其运行依赖；内网镜像不可达，统一走公网源
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
